# Fork-only UI evidence harness. Do not merge into the feature branch.
name: Proxy editor UI evidence

on:
  push:
    branches: ['repro/proxy-edit-ui-*']
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Upstream E2E run for the feature commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  proxy-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /tmp/proxy-ui-avd
      APK_RUN_ID: ${{ inputs.apk_run_id || '44207887528' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Android emulator
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" platform-tools emulator 'system-images;android-35;google_apis;x86_64' > /tmp/sdk-install.log 2>&1 || { tail -60 /tmp/sdk-install.log; exit 1; }

      - name: Verify the upstream APK run and wait for its artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { setTimeout } from 'node:timers/promises';

          const expectedCommit = execFileSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' }).trim();
          const runId = process.env.APK_RUN_ID;
          if (!/^\d+$/.test(runId)) throw new Error('Invalid E2E run ID');
          const runPath = 'repos/meow-rs/meow-android/actions/runs/' + runId;
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const deadline = Date.now() + 12 * 60 * 1000;
          while (Date.now() < deadline) {
            const run = api(runPath);
            if (run.head_sha !== expectedCommit || run.event !== 'pull_request' || run.path !== '.github/workflows/e2e.yml') {
              throw new Error('Expected the upstream PR E2E run for ' + expectedCommit);
            }
            const { artifacts } = api(runPath + '/artifacts?name=debug-apk');
            if (artifacts.some((artifact) => artifact.name === 'debug-apk' && !artifact.expired)) {
              console.log('Verified debug APK for ' + expectedCommit + ' from ' + run.html_url);
              process.exit(0);
            }
            if (run.status === 'completed') throw new Error('E2E run completed without the debug APK');
            await setTimeout(10000);
          }
          throw new Error('Timed out waiting for the upstream debug APK');
          NODE

      - name: Download the upstream debug APK
        uses: actions/download-artifact@v4
        with:
          repository: meow-rs/meow-android
          name: debug-apk
          path: mobile/build/outputs/apk/debug
          run-id: ${{ env.APK_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Enable KVM and create AVD
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name proxy-edit-ui --package 'system-images;android-35;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/proxy-edit-ui.avd" --force
          test -f "$ANDROID_AVD_HOME/proxy-edit-ui.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/proxy-edit-ui.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/proxy-edit-ui.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx proxy-edit-ui

      - name: Verify editor through the real app UI
        timeout-minutes: 8
        env:
          APK: mobile/build/outputs/apk/debug/mobile-debug.apk
          OUT: proxy-editor-evidence
        run: timeout --signal=TERM --kill-after=10s 7m python3 scripts/proxy-edit-ui-repro.py

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-editor-ui-evidence
          path: proxy-editor-evidence/
          if-no-files-found: ignore
          retention-days: 5
