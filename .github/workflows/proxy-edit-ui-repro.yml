# Fork-only UI evidence harness. Do not merge into the feature branch.
name: Proxy editor UI evidence

on:
  push:
    branches: ['repro/proxy-edit-ui-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/src/main/rust/meow-android-ffi/target
          key: cargo-${{ runner.os }}-x86_64-${{ hashFiles('core/src/main/rust/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-x86_64-

      - name: Install Android SDK and build tools
        run: |
          printf 'y\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "ndk;27.0.12077973" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" "platforms;android-35" > /tmp/sdk-install.log 2>&1 || { tail -60 /tmp/sdk-install.log; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          command -v cargo-ndk || cargo install cargo-ndk

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and debug APK
        run: ./gradlew :core:testDebugUnitTest :mobile:testDebugUnitTest :mobile:lintDebug :core:lintDebug :mobile:assembleDebug -PTARGET_ABI=x86_64 -PCARGO_PROFILE=debug

      - name: Enable KVM and create AVD
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name proxy-edit-ui --package 'system-images;android-35;google_apis;x86_64' --device pixel_2 --force

      - name: Verify editor through the real app UI
        timeout-minutes: 8
        env:
          APK: mobile/build/outputs/apk/debug/mobile-debug.apk
          OUT: proxy-editor-evidence
        run: timeout --signal=TERM --kill-after=10s 7m python3 scripts/proxy-edit-ui-repro.py

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-editor-ui-evidence
          path: proxy-editor-evidence/
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-editor-check-reports
          path: |
            mobile/build/reports/tests/testDebugUnitTest/
            mobile/build/reports/lint-results-debug.html
            core/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 5
