name: macOS Android screenshot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proxy-servers:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # macos-latest is an Apple Silicon runner on the current GitHub image;
      # keep the expressions architecture-aware so a label migration back to
      # Intel still produces an emulator-compatible APK instead of an adb
      # device that cannot execute the native library.
      TARGET_ABI: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
      EMULATOR_ARCH: ${{ runner.arch == 'ARM64' && 'arm64-v8a' || 'x86_64' }}
      RUST_ANDROID_TARGET: ${{ runner.arch == 'ARM64' && 'aarch64-linux-android' || 'x86_64-linux-android' }}
      SS_TARGET: ${{ runner.arch == 'ARM64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_ANDROID_TARGET }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            core/src/main/rust/meow-android-ffi/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-screenshot-${{ hashFiles('core/src/main/rust/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-screenshot-

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "emulator" "platform-tools" "platforms;android-35" \
            "system-images;android-35;google_apis;$EMULATOR_ARCH" \
            "ndk;28.2.13676358" "ndk;27.0.12077973"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install build tools
        run: |
          command -v cargo-ndk || cargo install cargo-ndk
          SS_VERSION=1.25.0
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/shadowsocks/shadowsocks-rust/releases/download/v${SS_VERSION}/shadowsocks-v${SS_VERSION}.${SS_TARGET}.tar.xz" \
            | tar -xJ -C "$HOME/.cargo/bin" ssserver
          chmod +x "$HOME/.cargo/bin/ssserver"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK for the emulator ABI
        run: ./gradlew :mobile:assembleDebug -PTARGET_ABI="$TARGET_ABI" -PCARGO_PROFILE=debug

      - name: Boot emulator and capture Proxy Servers
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Start a fresh adb daemon because this runner image can leave a
          # stale daemon behind before the action launches the emulator.
          ANDROID_I_WANT_MY_TCG: no
          SSSERVER: ssserver
          SCREENSHOT_PROXY_SERVERS: "true"
          SCREENSHOT_PROFILE_URL: https://api.gengjiawen.com/clash.yml
          SKIP_EMULATOR_BOOT: "true"
          TUN_WAIT_SECS: "120"
        with:
          api-level: 35
          target: google_apis
          arch: ${{ env.EMULATOR_ARCH }}
          profile: pixel_2
          # A cold Android 35 boot can stay offline for several minutes while
          # the userdata image initializes. Avoid snapshot probing and allow
          # enough time for the first boot.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -accel on
          emulator-boot-timeout: 1200
          disable-animations: true
          pre-emulator-launch-script: |
            set -euxo pipefail
            # Keep the first boot small enough for the hosted runner's single
            # available vCPU and slow software display path.
            AVD_CONFIG="$HOME/.android/avd/test.avd/config.ini"
            if [ -f "$AVD_CONFIG" ]; then
              {
                echo 'hw.lcd.width=720'
                echo 'hw.lcd.height=1280'
                echo 'hw.lcd.density=320'
                echo 'hw.ramSize=1536'
              } >> "$AVD_CONFIG"
            fi
            "$ANDROID_HOME/platform-tools/adb" kill-server || true
            "$ANDROID_HOME/platform-tools/adb" start-server
            "$ANDROID_HOME/platform-tools/adb" version
          # The action executes each physical script line in its own shell.
          # Keep the path overrides on the same command and put the other
          # values in `env` below so test-e2e.sh receives them reliably.
          script: ADB="$ANDROID_HOME/platform-tools/adb" EMULATOR="$ANDROID_HOME/emulator/emulator" APK="mobile/build/outputs/apk/debug/mobile-debug.apk" ./test-e2e.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-servers-macos-screenshots
          path: screen_*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-servers-macos-diagnostics
          path: |
            e2e-logcat.log
            ui_dump_*.xml
          if-no-files-found: ignore
          retention-days: 14
